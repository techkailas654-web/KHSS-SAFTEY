<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road Safety Gallery</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
}

header{
background:#1976d2;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#0d47a1;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
font-weight:bold;
}

.container{
width:90%;
max-width:1200px;
margin:auto;
padding:30px 0;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:220px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

.gallery img:hover{
transform:scale(1.05);
}

#popup{
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:999;
}

#popup img{
max-width:90%;
max-height:85%;
border-radius:10px;
}

#close{
position:absolute;
top:20px;
right:30px;
font-size:40px;
color:white;
cursor:pointer;
}

footer{
background:#1976d2;
color:white;
text-align:center;
padding:20px;
margin-top:30px;
}
</style>

</head>

<body>

<header>
<h1>📸 Road Safety Gallery</h1>
<p>Awareness Through Pictures</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<div class="gallery">

<img src="https://picsum.photos/500/350?random=11" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=12" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=13" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=14" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=15" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=16" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=17" onclick="openImg(this.src)">
<img src="https://picsum.photos/500/350?random=18" onclick="openImg(this.src)">

</div>

</div>

<div id="popup">
<span id="close" onclick="closeImg()">&times;</span>
<img id="bigImage">
</div>

<footer>
<h3>SAFE ROADS, SAFE LIVES</h3>
<p>Little KITEs & SEED Club</p>
<p>KHSS Kannadi, Palakkad</p>
</footer>

<script>

function openImg(src){
document.getElementById("popup").style.display="flex";
document.getElementById("bigImage").src=src;
}

function closeImg(){
document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
